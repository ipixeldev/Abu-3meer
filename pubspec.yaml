name: abu_3meer
description: "Abu 3meer — predict exact scores, answer video questions, find Player Cards, and climb the leaderboard."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  # Routing (deep links, web URLs, nested shells)
  # Typography (fetches + caches fonts; falls back gracefully offline)
  google_fonts: ^6.2.1

  # Local persistence for non-sensitive preferences.
  # Date / number formatting
  intl: ^0.20.2
  firebase_core: ^4.13.0
  lottie: ^3.5.1
  url_launcher: ^6.3.2
  provider: ^6.1.5+1
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  google_sign_in: ^7.2.0
  firebase_storage: ^13.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  # Brand and editorial assets are bundled for reliable mobile/PWA rendering.
