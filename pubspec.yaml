name: abu_3meer
description: "Abu 3meer — predict exact scores, answer video questions, guess featured players, and climb the leaderboard."
publish_to: 'none'

version: 1.1.0+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  # Routing (deep links, web URLs, nested shells)
  # Typography (fetches + caches fonts; falls back gracefully offline)
  google_fonts: ^6.2.1

  # Local persistence for non-sensitive preferences.
  # Date / number formatting
  intl: ^0.20.2
  firebase_core: ^4.13.0
  lottie: ^3.5.1
  url_launcher: ^6.3.2
  provider: ^6.1.5+1
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  google_sign_in: ^7.2.0
  firebase_storage: ^13.4.6
  http: ^1.6.0
  image_picker: ^1.2.3
  web: ^1.1.1
  liquid_glass_widgets:
    path: packages/liquid_glass_widgets
  geolocator: ^14.0.3
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  glass_liquid_navbar: ^0.2.0
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/branding/

  # Brand and editorial assets are bundled for reliable mobile/PWA rendering.
